<!--
comentário em HTML
Elementos
Atributos
-->
<h1 id="title">Title</h1>

<!--
Nesse caso id="title" é o atributo que pode ser usado como referencia no futuro.
O elemento é o básico do HTML e é composto por <tag atributo="valor">conteúdo</tag>
Existem elementos que a tag não precisa de fechamento como <br/> que funciona como quebra de linha.
-->

<p>
    texto &nbsp;&nbsp;&nbsp;texto
</p>
<br>
<p>
    Novo paragrafo
</p>

<!--
Nesse caso o &nbsp; serve como uma adição de espaço
E uma quebra de linha pode ser representada por <p><p/> ou por <br>
-->

<a href="#">link</a>
<br>
<a href="#">link</a>

<!--
No fluxo de HTML alguns elementos podem ser considerados inline ou block.
Block são os elementos que se posicionam abaixo um do outro como <p><p/>
Inline são os elementos que se posicionam a frente um do outro como <a><a/>
Obs.: em resumo o HTML não imprime a ordem de escrita que consta no código
-->

<p>Lorem <em>ipsum</em> dolor <strong>sit</strong> amet consectetur adipisicing elit. Doloribus, modi. Delectus consequatur illum omnis a et quis nam amet incidunt consequuntur rem! Neque dolores atque beatae quas inventore dolorem ipsa?</p>

<!--
Existem tags de alinhamento que podem ser incluidas dentro de outra tag.
<em></em> e também o <strong></strong> que servem para tranformar o texto em italico e negrito.
-->

<code>
    <p></p>
</code>
<!--Isso não funciona-->

&lt;p&gt;&lt;/p&gt;
<!--Isso funciona-->
<!--
Esse é o novo conceito para aprender a imprimir tags como um texto. 
O navegador não permite a primeira opção, pois ele identifica o <p></p> como uma tag e isso não é visivel.
No segundo exemplo é demontrado que o < é simbolizado por &lt; e o > é simbolizado por &gt;
Isso é chamado de caractere reservado
-->
