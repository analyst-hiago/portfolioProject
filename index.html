<!--
comentário em HTML
Elementos
Atributos
-->
<h1 id="title">Title</h1>

<!--
Nesse caso id="title" é o atributo que pode ser usado como referencia no futuro.
O elemento é o básico do HTML e é composto por <tag atributo="valor">conteúdo</tag>
Existem elementos que a tag não precisa de fechamento como <br/> que funciona como quebra de linha.
-->

<p>
    texto &nbsp;&nbsp;&nbsp;texto
</p>
<br>
<p>
    Novo paragrafo
</p>

<!--
Nesse caso o &nbsp; serve como uma adição de espaço
E uma quebra de linha pode ser representada por <p><p/> ou por <br>
-->
