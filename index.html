
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página de Login</title>
</head>
<body>

    <!-- Cabeçalho com título à esquerda e links à direita -->
    <header>
        <table width="100%">
            <tr>
                <td align="left">
                    <h1>Meu Site</h1>
                </td>
                <td align="right">
                    <a href="index.html">Home</a> |
                    <a href="#sobre">Sobre</a>
                </td>
            </tr>
        </table>
    </header>


    <!-- Imagem estética -->
    <section>
        <img src="./cat-icon.png" alt="gato tirando selfie com os amigos" width="600" height="200">
    </section>

    <!-- Seção de Login -->
    <section>
        <h2>Login</h2>
        <form action="#" method="post">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" required><br><br>

            <button type="submit">Entrar</button><br><br>

            <a href="#">Esqueceu a senha?</a>
        </form>
    </section>

    <!-- Sobre -->
    <section id="sobre">
        <h2>Sobre</h2>
        <p>Este é um exemplo de site com uma página de login simples usando apenas HTML.</p>
    </section>

</body>
</html>
